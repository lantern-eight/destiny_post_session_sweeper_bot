[project]
name = "destiny-post-session-sweeper-bot"
version = "1.1.0"
description = "Decides which Destiny 2 gear to keep or shard after each session and stages the shards for dismantling"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[project.scripts]
sweeper = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = [
  "E",      # pycodestyle
  "F",      # Pyflakes
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "I",      # isort
  "PT",     # pytest style
  "Q",      # flake8-quotes (single quotes per AGENTS.md)
]
# E501 (line length) is on: the formatter wraps code, but not long strings or
# comments, and AGENTS.md sets 88 characters.

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
# Preserve quote style so docstrings stay single-quoted (''' per AGENTS.md).
quote-style = "preserve"
