# Your own weapon rolls. Each roll keeps the best copy of that weapon that can
# roll it; weapons without a roll here keep their best copy by Voltron.
# Weapon names ignore Adept, Timelost, Harrowed, and Baroque; perk names are the
# in-game names (enhanced perks count as the base perk).
#
# A roll lists its perks one column to a line, named the way the game names the
# column: perk_1 and perk_2 (the traits), origin_trait, barrel, magazine, and
# masterwork (or launcher_barrel, scope, battery, blade, guard, bowstring,
# arrow, or haft on weapons that have those). Write choices for one column as
# [Chaos Reshaped, Firefly]: a copy with either one matches, and the roll still
# keeps a single copy.
#
# Traits are primary: a copy matches when it can have every listed trait at
# once. Everything else is secondary: optional, and of the copies that match,
# the one with the most of it is kept, then the one with the masterwork stat.
# A roll can say it is for pve or pvp (mode), and the plan names it that way.
# Rolls saved by the tie step also note when they were added and the game
# version (Bungie's manifest version) at the time, since perk pools and the
# meta change. Everything but perks is optional.
#
# Fatebringer:
#   - label: add clear
#     perks:
#       - perk_1: Explosive Payload
#       - perk_2: Firefly
#   - mode: pvp
#     perks:
#       - perk_1: [Explosive Payload, Opening Shot]
#       - perk_2: Kill Clip
#       - masterwork: Range

